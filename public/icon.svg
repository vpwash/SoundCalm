<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="180" fill="url(#halo)"/>

  <!-- Protective Outer Sound Ring (Soft harmonic buffer) -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#waveGrad)" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="8 12"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="url(#waveGrad)" stroke-width="6" stroke-opacity="0.5"/>

  <!-- Misophonia Acoustic Shield & Calming Waves -->
  <!-- Wave Bars Centered -->
  <g filter="url(#glow)">
    <line x1="160" y1="230" x2="160" y2="282" stroke="url(#waveGrad)" stroke-width="14" stroke-linecap="round"/>
    <line x1="192" y1="205" x2="192" y2="307" stroke="url(#waveGrad)" stroke-width="14" stroke-linecap="round"/>
    <line x1="224" y1="175" x2="224" y2="337" stroke="url(#waveGrad)" stroke-width="14" stroke-linecap="round"/>
    <line x1="256" y1="150" x2="256" y2="362" stroke="url(#waveGrad)" stroke-width="14" stroke-linecap="round"/>
    <line x1="288" y1="175" x2="288" y2="337" stroke="url(#waveGrad)" stroke-width="14" stroke-linecap="round"/>
    <line x1="320" y1="205" x2="320" y2="307" stroke="url(#waveGrad)" stroke-width="14" stroke-linecap="round"/>
    <line x1="352" y1="230" x2="352" y2="282" stroke="url(#waveGrad)" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- Constellation Nodes on top of waves -->
  <circle cx="256" cy="150" r="10" fill="#F8FAFC"/>
  <circle cx="224" cy="175" r="8" fill="#F8FAFC"/>
  <circle cx="288" cy="175" r="8" fill="#F8FAFC"/>
  <circle cx="192" cy="205" r="7" fill="#F8FAFC"/>
  <circle cx="320" cy="205" r="7" fill="#F8FAFC"/>
  <circle cx="160" cy="230" r="6" fill="#F8FAFC"/>
  <circle cx="352" cy="230" r="6" fill="#F8FAFC"/>
</svg>
